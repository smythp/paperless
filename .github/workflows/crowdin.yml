name: Crowdin Action
on:
  workflow_dispatch:
  schedule:
    - cron: '2 */12 * * *'
  push:
    paths: ['src/locale/**', 'src-ui/messages.xlf', 'src-ui/src/locale/**']
    branches: [dev]
permissions:
  contents: write
  pull-requests: write
jobs:
  synchronize-with-crowdin:
    name: Crowdin Sync
    if: github.repository_owner == 'paperless-ngx'
    runs-on: ubuntu-26.04
    environment: translation-sync
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1
        with:
          token: ${{ secrets.PNGX_BOT_PAT }}
          persist-credentials: false
      - name: crowdin action
        uses: chainguard-actions/crowdin-github-action@ddb300e70e7a259e227cfdbd20a92a5907132c25 # v3.3.0
        with:
          upload_translations: false
          download_translations: true
          crowdin_branch_name: 'dev'
          localization_branch_name: l10n_dev
          pull_request_labels: 'skip-changelog, translation'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
